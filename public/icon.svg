<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Background Grid Subtle Accents -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.1" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.15" />

  <!-- Modern Chart & Currency Symbol -->
  <g transform="translate(100, 100)">
    <!-- Upward Trend Line with Area Glow -->
    <path d="M 30 230 L 100 170 L 180 200 L 280 80" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Dots along chart -->
    <circle cx="30" cy="230" r="12" fill="#047857" stroke="#34d399" stroke-width="6" />
    <circle cx="100" cy="170" r="12" fill="#047857" stroke="#34d399" stroke-width="6" />
    <circle cx="180" cy="200" r="12" fill="#047857" stroke="#34d399" stroke-width="6" />
    <circle cx="280" cy="80" r="16" fill="#34d399" stroke="#ffffff" stroke-width="6" />

    <!-- Currency Brazilian Real / Dollar styled clean symbol -->
    <g transform="translate(110, 40)">
      <rect x="0" y="0" width="84" height="84" rx="24" fill="#0f172a" fill-opacity="0.8" stroke="#34d399" stroke-width="4" />
      <text x="42" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#34d399" text-anchor="middle">R$</text>
    </g>
  </g>
</svg>
